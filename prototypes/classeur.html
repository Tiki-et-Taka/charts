<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Classeur</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=18">
<script src="js/site-scale.js?v=9"></script>
<script src="js/legal-return.js?v=2"></script>
<style>
  :root {
    --bg: #0d0d0d;
    --bg-elev: #141414;
    --ink: #f2f0eb;
    --muted: #8a8680;
    --line: #2a2a2a;
    --line-hi: #3a3a3a;
    --accent: #e68a1e;
    --accent-ink: #111;
    --panel: #161616;
    --font-display: "Archivo Black", "Oswald", Impact, sans-serif;
    --font-ui: "Oswald", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
  }
  a { color: inherit; }
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    opacity: .14;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .top {
    position: sticky; top: 0; z-index: 20;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: rgba(13,13,13,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    justify-self: start;
    font-family: var(--font-display);
    font-size: clamp(22px, 3vw, 30px);
    letter-spacing: .04em;
    text-transform: uppercase;
    text-decoration: none;
    line-height: 1;
  }
  .nav-main {
    justify-self: center;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 20px;
  }
  .nav-main a {
    position: relative;
    text-decoration: none;
    font-size: 12px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); padding: 6px 0 8px;
  }
  .nav-main a:hover { color: var(--ink); }
  .nav-main a.on { color: var(--ink); }
  .nav-main a.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--accent);
  }
  .nav-badge {
    position: absolute;
    top: -7px; right: -14px;
    min-width: 15px; height: 15px; padding: 0 4px;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 500; line-height: 15px;
    text-align: center;
    letter-spacing: 0;
    text-transform: none;
    pointer-events: none;
  }
  .nav-badge[hidden] { display: none; }
  .top-actions {
    justify-self: end; display: flex; align-items: center; gap: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--panel);
    padding: 6px 10px; font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
    white-space: nowrap;
  }
  .chip .coin {
    width: 22px; height: 14px; border-radius: 0;
    display: block; object-fit: contain;
    box-shadow: none;
    flex: 0 0 auto;
  }
  .chip.btn {
    appearance: none; font: inherit; cursor: pointer; color: inherit;
  }
  .chip.btn:hover { border-color: var(--line-hi); background: #1c1c1c; }
  .chip .ico,
  .chip.btn .ico { width: 14px; height: 14px; opacity: .75; }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .page-head { margin-bottom: 22px; }
  .page-head.profile {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .profile-banner[hidden] { display: none; }
  #profileFace { width: 72px; height: 72px; }
  .page-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 42px);
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: .95;
  }
  .page-meta {
    margin: 10px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .filters {
    border: 1px solid var(--line-hi);
    outline: 1px solid var(--line);
    outline-offset: 3px;
    padding: 14px 16px 12px;
    margin-bottom: 22px;
    display: grid;
    gap: 12px;
  }
  .filt-sheet-panel { display: contents; }
  .filt-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
  }
  .filt-toolbar .filt-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
  }
  .filt-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  }
  .filt-label {
    flex: 0 0 auto;
    min-width: 72px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .filt-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .fchip {
    appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 10px; cursor: pointer;
  }
  .fchip:hover { color: var(--ink); border-color: var(--line-hi); }
  .fchip.on {
    color: var(--accent-ink); background: var(--accent); border-color: var(--accent);
  }
  .fchip:disabled {
    opacity: .4;
    cursor: default;
  }
  .fchip:disabled:hover { color: var(--muted); border-color: var(--line); }
  .filt-mark-seen { margin-left: auto; }
  .filt-sort {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .filt-row-sort .filt-sort { margin-left: 0; }
  .filt-sort select {
    appearance: none;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: inherit; padding: 6px 28px 6px 10px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 12px) 55%, calc(100% - 7px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .filt-search {
    width: min(240px, 100%);
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-family: var(--font-mono); font-size: 11px;
    padding: 7px 10px;
  }
  .filt-search::placeholder { color: #5a5650; }

  /* Bureau : ordre d’origine. Le HTML a été réordonné pour le panneau mobile. */
  @media (min-width: 821px) {
    .filters {
      grid-template-columns: 1fr auto;
    }
    .filt-sheet-panel,
    .filt-toolbar {
      display: contents;
    }
    .filt-row-rare {
      grid-column: 1 / -1;
      grid-row: 1;
    }
    .filt-row-instr {
      grid-column: 1 / -1;
      grid-row: 2;
    }
    .filt-row-genre {
      grid-column: 1 / -1;
      grid-row: 3;
    }
    .filt-row-search {
      grid-column: 1;
      grid-row: 4;
    }
    .filt-row-sort {
      grid-column: 2;
      grid-row: 4;
      justify-content: flex-end;
    }
    .filt-row-sort .filt-sort {
      margin-left: auto;
    }
    .filt-row-quick {
      grid-column: 1 / -1;
      grid-row: 5;
    }
  }

  .binder {
    position: relative;
    border: 1px solid var(--line-hi);
    background: linear-gradient(90deg, #101010 0 28px, var(--bg-elev) 28px);
    padding: 18px 18px 18px 40px;
    min-height: 420px;
  }
  .binder-rings {
    position: absolute; left: 0; top: 0; bottom: 0; width: 28px;
    display: flex; flex-direction: column; justify-content: space-evenly; align-items: center;
    pointer-events: none;
  }
  .binder-rings i {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #3a3a3a; background: #0a0a0a;
    box-shadow: inset 0 0 0 2px #1a1a1a;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 16px 12px;
  }
  @media (max-width: 720px) {
    .top { grid-template-columns: 1fr auto; }
    .nav-main { grid-column: 1 / -1; justify-content: flex-start; }
    .filt-sort { margin-left: 0; width: 100%; }
  }

  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 0;
    width: 100%;
  }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 260 / 364;
    height: auto;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
  }
  .thumb .card {
    position: absolute; top: 0; left: 0;
    transform-origin: top left;
    pointer-events: auto;
  }
  .cell.hole .thumb { filter: none; opacity: .72; }
  .cell.hole .card { cursor: default; }
  .cell.is-new .thumb {
    border-radius: 12px;
    box-shadow:
      0 0 0 2px #f59e0b,
      0 0 22px rgba(245, 158, 11, .55),
      0 10px 16px rgba(0,0,0,.45);
  }
  .cell.is-new .thumb::after {
    content: "Nouveau";
    position: absolute; top: 4px; left: 4px; z-index: 3;
    background: #f59e0b; color: #111;
    font-family: var(--font-mono); font-size: 8px; font-weight: 500;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 4px;
  }
  .dup {
    position: absolute; top: 4px; left: 4px; z-index: 3;
    background: #111; color: #e8e8ea; border: 1px solid #2a2c32;
    font-family: var(--font-mono); font-size: 9px; font-weight: 500;
    letter-spacing: .04em; padding: 1px 4px;
  }
  .cell.is-new .dup { top: 28px; }
  .fav-btn {
    appearance: none; position: absolute; top: 4px; right: 4px; z-index: 4;
    width: 20px; height: 20px; padding: 0; margin: 0;
    border: 0; background: none; color: #6a7078;
    font-family: system-ui, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1; font-weight: 700;
    cursor: pointer; display: grid; place-items: center;
  }
  .fav-btn::before {
    content: "★";
    display: block;
    transform: translateY(-1px);
  }
  .fav-btn:hover { color: #d8b35c; }
  .fav-btn.on { color: #d8b35c; }
  .cell.hole .fav-btn { display: none; }
  /* carte (même DA que booster) */
  .card {
    position: relative; width: 260px; height: 364px;
    border-radius: 10px; overflow: hidden;
    background: #0F1012;
  }
  .card.paper { background: #EDE4D4; }
  .card.zoomable { cursor: pointer; }
  .art {
    position: absolute; top: 12px; left: 12px; right: 12px; bottom: 120px;
    overflow: hidden; background: #111;
  }
  .art img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 18%;
    display: block;
  }
  .card.paper .art { background: #E6D9C4; }
  .card.paper .art img { object-position: center top; }
  .band {
    position: absolute; left: 12px; right: 12px; bottom: 12px; height: 108px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 3px; padding: 12px 20px 22px 12px;
  }
  .card.paper .band { background: #EDE4D4; }
  .accent { height: 3px; width: 36px; border-radius: 1px; margin-bottom: 4px; flex-shrink: 0; }
  .card.diamant .art { inset: 0; }
  .card.diamant .title {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 18px 12px 40px; text-align: center;
    background: linear-gradient(to bottom, rgba(8,7,6,.78) 32%, rgba(8,7,6,0));
    pointer-events: none;
  }
  .card.diamant .title .myth-name {
    font-family: "Big Shoulders Display", Oswald, sans-serif;
    font-weight: 800; line-height: 1; letter-spacing: .06em;
    color: #F4F2EC; text-shadow: 0 1px 10px rgba(0,0,0,.55);
    text-transform: uppercase; white-space: nowrap;
  }
  .card.diamant .band {
    left: 0; right: 0; bottom: 0; height: auto;
    padding: 24px 12px 28px; text-align: center;
    background: linear-gradient(to top, rgba(8,7,6,.88) 48%, rgba(8,7,6,0));
  }
  .card.diamant .accent,
  .card.diamant .band .name,
  .card.diamant .rarete,
  .card.diamant .meta,
  .card.diamant .group { display: none; }
  .card.diamant .line-rare {
    font-size: 10px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: #E8D5A3;
  }
  .card.diamant .line-info {
    margin-top: 6px; font-size: 11px; letter-spacing: .03em; color: #c8c2b6;
  }
  .card.diamant .line-group { color: #E8D5A3; }
  .name {
    font-family: Oswald, Impact, sans-serif;
    font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; line-height: 1.05; color: #F4F2EC;
  }
  .card.paper .name { color: #161410; }
  .rarete {
    position: absolute;
    right: 2px;
    top: 10px;
    bottom: 22px;
    width: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    line-height: 1;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    pointer-events: none;
  }
  .meta { font-size: 10.5px; color: #c8c2b6; letter-spacing: .02em; }
  .card.paper .meta { color: #5c564c; }
  .group { font-size: 10.5px; color: #d8b35c; letter-spacing: .03em; }
  .card.paper .group { color: #8a6a4f; }
  .marks {
    position: absolute; left: 16px; right: 16px; bottom: 10px; z-index: 2;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8px; font-weight: 600;
    color: rgba(200,194,186,.55); pointer-events: none;
  }
  .marks .serie { letter-spacing: .12em; }
  .marks .no { letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .card.paper .marks { color: rgba(90,70,64,.45); }
  .card.diamant .marks { color: rgba(232,213,163,.55); }
  .frame { position: absolute; inset: 0; pointer-events: none; }

  .card.card-back { background: #EDE4D4; }
  .bk-field {
    position: absolute; top: 12px; left: 12px; right: 12px; bottom: 78px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(92, 28, 24, .08), transparent 62%),
      #E6D9C4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .bk-field::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(92, 32, 28, .28) 0.7px, transparent 0.9px);
    background-size: 5px 5px;
    pointer-events: none;
  }
  .bk-plate {
    position: absolute; inset: 14px;
    border: 1px solid rgba(90, 38, 34, .28);
    pointer-events: none;
  }
  .bk-mark { position: relative; z-index: 1; }
  .wave { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
  .wave i { display: block; width: 6px; border-radius: 0; background: #8F2A28; }
  .wave i:nth-child(1){ height: 11px; }
  .wave i:nth-child(2){ height: 19px; }
  .wave i:nth-child(3){ height: 28px; }
  .wave i:nth-child(4){ height: 34px; }
  .wave i:nth-child(5){ height: 23px; }
  .wave i:nth-child(6){ height: 14px; }
  .bk-name {
    position: relative; z-index: 1;
    font-family: Oswald, sans-serif; font-weight: 600;
    letter-spacing: .12em; font-size: 22px; color: #1A1412;
  }
  .bk-band {
    position: absolute; left: 12px; right: 12px; bottom: 12px; height: 66px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px;
    background: #EDE4D4;
  }
  .bk-artist {
    max-width: calc(100% - 20px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #77716d;
    font-family: Oswald, sans-serif; font-size: 16px; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase; text-align: center;
  }
  .bk-foot {
    font-size: 9px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: #6A5650;
  }

  .empty {
    grid-column: 1 / -1;
    padding: 48px 16px;
    text-align: center;
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  }

  .pager {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-top: 18px;
  }
  .pager button {
    appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; padding: 8px 14px; cursor: pointer;
  }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager .lbl {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }

  .foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; color: #5a5650;
  }
  .foot a { text-decoration: none; }
  .foot a:hover { color: var(--ink); }
  .status {
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    padding: 40px 0; text-align: center;
  }

  /* drawer */
  .drawer-veil {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 92vw);
    background: var(--bg-elev); border-left: 1px solid var(--line);
    z-index: 45; padding: 18px; overflow: auto;
  }
  .drawer .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .drawer h2 {
    margin: 0; font-family: var(--font-display); font-size: 20px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .drawer .close {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font-size: 28px; line-height: 1; cursor: pointer;
  }
  .drawer label {
    display: block; font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  .user-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .user-switch button {
    flex: 1; appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; padding: 10px; cursor: pointer;
  }
  .user-switch button.on { border-color: var(--accent); color: var(--accent); }
  .drawer .links a {
    display: block; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
    color: var(--muted); padding: 8px 0;
  }

  /* zoom — display:none by default; :not([hidden]) so [hidden] is not overridden */
  .zoom {
    position: fixed; inset: 0; z-index: 60;
    display: none;
    place-items: center;
    background: rgba(0,0,0,.78); padding: 24px;
  }
  .zoom:not([hidden]) { display: grid; }
  .zoom-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.55));
  }
  .zoom-card .card { cursor: default; }
  .zoom-origin {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0;
    max-width: 360px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #f4f1ea;
  }
  .zoom-origin-nav {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;

<script>
if(window.ChartsAuthBlocked) throw new Error("auth");
const EXEC = {
  commune:"A", argent:"B", or:"A", platine:"B", diamant:"B"
};
const INSTR = {
  voix:"Voix", guitare:"Guitare", basse:"Basse", batterie:"Batterie",
  claviers:"Claviers", vents:"Vents", cordes:"Cordes", machines:"Machines"
};
const INSTR_ORDER = ["voix","guitare","basse","batterie","claviers","vents","cordes","machines"];
const FAMILIES = {
  metal:     {label:"Métal",              fond:"#121214", a1:"#B8352F"},
  punk:      {label:"Punk & hardcore",    fond:"#141416", a1:"#E04A2F"},
  "hip-hop": {label:"Hip-hop",            fond:"#121410", a1:"#C8D44E"},
  électro:   {label:"Électronique",       fond:"#0B1220", a1:"#3FC1C9"},
  reggae:    {label:"Reggae & dub",       fond:"#0F1610", a1:"#D9B52B"},
  afro:      {label:"Afro",               fond:"#16120C", a1:"#E09A2B"},
  latin:     {label:"Latin",              fond:"#1C1210", a1:"#D4552F"},
  jazz:      {label:"Jazz",               fond:"#0E1A1C", a1:"#D8B35C"},
  blues:     {label:"Blues",              fond:"#0C1420", a1:"#4A7FB5"},
  funk:      {label:"Funk & disco",       fond:"#1A1222", a1:"#E0A32B"},
  "R&B":     {label:"R&B & soul",         fond:"#1A1012", a1:"#C47A5A"},
  country:   {label:"Country",            fond:"#171310", a1:"#C89A4A"},
  folk:      {label:"Folk",               fond:"#121710", a1:"#9CB06A"},
  world:     {label:"Musiques du monde",  fond:"#101614", a1:"#B58A4E"},
  chanson:   {label:"Chanson & variété",  fond:"#16131A", a1:"#C9869B"},
  pop:       {label:"Pop",                fond:"#1C1020", a1:"#D45E8A"},
  rock:      {label:"Rock",               fond:"#15110E", a1:"#D98A2B"}
};
const GENRE_ORDER = Object.keys(FAMILIES);
const FAMILY_FROM_CATALOG = { hiphop:"hip-hop", electro:"électro", rnb:"R&B" };
const TIERS = {
  commune: { rank:0, label:"Commune", frame:"#5E6670", kind:"simple" },
  argent:  { rank:1, label:"Argent",  frame:"#8A949B", kind:"double" },
  or:      { rank:2, label:"Or",      frame:"#B08D57", kind:"filets" },
  platine: { rank:3, label:"Platine", frame:"#C3CAD1", kind:"filets" },
  diamant: { rank:4, label:"Diamant", frame:"#D8B35C", kind:"none" }
};
const CW = 260, CH = 364;
const RARE_ORDER = ["commune","argent","or","platine","diamant"];
const askedPlayer = new URLSearchParams(location.search).get("joueur");
function knownUser(id){
  return !!(window.ChartsAccounts && ChartsAccounts.has(id));
}
function displayName(id){
  return window.ChartsAccounts ? ChartsAccounts.name(id) : (id || "");
}
let profileUserId = knownUser(askedPlayer) ? askedPlayer : "";
const ACTIVE_USER_KEY = "charts.s1.activeUser";
const PAGE_SIZE_DESKTOP = 24; /* 6 × 4 */
const PAGE_SIZE_MOBILE = 40; /* 2 × 20 */
function pageSize(){
  return window.matchMedia("(max-width: 820px)").matches ? PAGE_SIZE_MOBILE : PAGE_SIZE_DESKTOP;
}

let activeUserId = "u1";
let catalog = [];
let filterRare = "";
let filterInstr = "";
let filterGenre = "";
let filterQ = "";
let hideMissing = true;
let lastGridHtml = "";
let newOnly = false;
let favOnly = false;
let sortBy = "num";
let page = 1;
const MARKET_KEY = "charts.s1.market";

const $ = id => document.getElementById(id);

function familyKey(f){ return FAMILY_FROM_CATALOG[f] || f; }
function collectionUserId(){ return profileUserId || activeUserId; }
function viewingOther(){ return !!profileUserId && profileUserId !== activeUserId; }
function ownedKey(userId){ return `charts.s1.${userId || collectionUserId()}.owned`; }
function walletKey(userId){ return `charts.s1.${userId || activeUserId}.wallet`; }
function foldRare(s){
  const t = String(s || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().trim();
  if(t === "legendaire" || t === "epique" || t === "platine") return "platine";
  if(t === "mythique" || t === "diamant") return "diamant";
  if(t === "rare" || t === "or") return "or";
  if(t === "peu commune" || t === "peucommune" || t === "argent") return "argent";
  if(t === "commune") return "commune";
  return t;
}
function foldSearch(s){
  return String(s || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase()
    .replace(/[\u2010-\u2015\u2212\uFE58\uFE63\uFF0D]/g, "-")
    .replace(/[\u2018\u2019\u201A\u2032]/g, "'").trim();
}
function matchesSearch(hay, needle){
  const n = foldSearch(needle);
  if(!n) return true;
  return foldSearch(hay).includes(n);
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function plateJob(plate, rarete){
  const exec = EXEC[rarete] || "A";
  return `${plate.style}_${exec}_${plate.instrument}_${plate.pose}_${plate.costume}_${plate.venue}_${plate.sil}`;
}
function cardsFromCatalog(doc){
  const artists = Object.fromEntries((doc.artists || []).map(a => [a.qid, a]));
  const plates = Object.fromEntries((doc.plates || []).map(p => [p.id, p]));
  const groups = Object.fromEntries((doc.groups || []).map(g => [g.mbid, g]));
  const out = [];
  for(const row of doc.cards || []){
    if(row.in_booster_pool === false) continue;
    const artist = artists[row.artist_qid];
    const plate = plates[row.plate_id];
    if(!artist || !plate) continue;
    const rarete = foldRare(row.rarity_current || row.rarity_initial);
    if(!TIERS[rarete]) continue;
    const g = row.group_mbid ? groups[row.group_mbid] : null;
    out.push({
      id: row.id,
      name: artist.name,
      rarete,
      famille: familyKey(row.family),
      instrument: artist.instrument || plate.instrument,
      instruments: artist.instruments || [artist.instrument || plate.instrument],
      group: g ? g.name : null,
      job: plateJob(plate, rarete),
      rank: Number(row.rank_in_series) || 0
    });
  }
  return out;
}
function normalizeGot(data){
  let dirty = false;
  for(const [id, got] of Object.entries(data.got || {})){
    if(typeof got === "number"){
      const n = Math.max(0, got | 0);
      data.got[id] = {
        n,
        t: 0,
        origins: Array.from({ length: n }, () => ({ k: "booster" }))
      };
      dirty = true;
    } else if(got && typeof got === "object" && !Array.isArray(got.origins)){
      const n = Math.max(0, got.n | 0);
      got.n = n;
      got.origins = Array.from({ length: n }, () => ({ k: "booster" }));
      dirty = true;
    }
  }
  return dirty;
}
function loadOwned(){
  try {
    const data = JSON.parse(localStorage.getItem(ownedKey()) || "");
    if(data && data.got && typeof data.got === "object"){
      if(!data.fresh || typeof data.fresh !== "object") data.fresh = {};
      if(!data.fav || typeof data.fav !== "object") data.fav = {};
      if(normalizeGot(data) && !viewingOther()) saveOwned(data);
      return data;
    }
  } catch {}
  return { v:2, got:{}, fresh:{}, fav:{} };
}
function saveOwned(data){
  if(viewingOther()) return;
  data.v = 2;
  if(!data.fresh || typeof data.fresh !== "object") data.fresh = {};
  if(!data.fav || typeof data.fav !== "object") data.fav = {};
  localStorage.setItem(ownedKey(activeUserId), JSON.stringify(data));
}
function isFresh(cardId){
  return !!(loadOwned().fresh || {})[cardId];
}
function clearFresh(cardId){
  const data = loadOwned();
  if(!data.fresh || !data.fresh[cardId]) return false;
  delete data.fresh[cardId];
  saveOwned(data);
  if(window.ChartsState) ChartsState.markSeen([cardId]);
  return true;
}
function isFavorite(cardId){
  return !!(loadOwned().fav || {})[cardId];
}
function favCount(){
  return Object.keys(loadOwned().fav || {}).length;
}
function loadMarket(){
  try {
    const data = JSON.parse(localStorage.getItem(MARKET_KEY) || "");
    if(data && Array.isArray(data.listings)){
      if(!Array.isArray(data.offers)) data.offers = [];
      if(!Array.isArray(data.trades)) data.trades = [];
      return data;
    }
  } catch {}
  return { listings: [], offers: [], trades: [] };
}
function saveMarket(data){
  localStorage.setItem(MARKET_KEY, JSON.stringify(data));
}
function setFavorite(cardId, on){
  if(!cardId) return false;
  const data = loadOwned();
  if(!data.fav || typeof data.fav !== "object") data.fav = {};
  if(on){
    data.fav[cardId] = true;
    saveOwned(data);
    const m = loadMarket();
    let dirty = false;
    m.listings = (m.listings || []).filter(l => {
      if(l.seller === activeUserId && l.cardId === cardId){
        dirty = true;
        return false;
      }
      return true;
    });
    for(const t of m.trades || []){
      if(t.status === "pending" && t.fromUser === activeUserId && t.offerCardId === cardId){
        t.status = "withdrawn";
        dirty = true;
      }
    }
    if(dirty) saveMarket(m);
  } else {
    delete data.fav[cardId];
    saveOwned(data);
  }
  if(window.ChartsState) ChartsState.setFavorite(cardId, on).catch(() => {});
  return !!on;
}
function toggleFavorite(cardId){
  return setFavorite(cardId, !isFavorite(cardId));
}
function favToggleBtn(cardId, on){
  return `<button type="button" class="fav-btn${on ? " on" : ""}" data-fav-toggle="${esc(cardId)}" aria-label="${on ? "Retirer des favoris" : "Ajouter aux favoris"}" title="${on ? "Retirer des favoris" : "Ajouter aux favoris"}" aria-pressed="${on ? "true" : "false"}"></button>`;
}
function freshCount(){
  const data = loadOwned();
  const fresh = data.fresh || {};
  const got = data.got || {};
  return Object.keys(fresh).filter(id => got[id]).length;
}
function clearAllFresh(){
  const data = loadOwned();
  if(!data.fresh || !Object.keys(data.fresh).length) return false;
  data.fresh = {};
  saveOwned(data);
  if(window.ChartsState) ChartsState.markSeen(null);
  return true;
}
function syncSeeAllNewBtn(){
  const btn = $("seeAllNew");
  if(!btn || profileUserId) return;
  btn.hidden = false;
  btn.disabled = freshCount() < 1;
}
function formatCredits(n){ return Number(n || 0).toLocaleString("fr-FR"); }
function refreshCredits(){
  let credits = 0, packs = 0;
  try {
    const data = JSON.parse(localStorage.getItem(walletKey()) || "");
    if(data && typeof data.credits === "number") credits = data.credits;
    packs = Math.max(0, Number(data && data.packs) || 0);
  } catch {}
  $("creditsBal").textContent = formatCredits(credits);
  const badge = $("packsBadge");
  if(badge){
    badge.textContent = String(packs);
    badge.hidden = packs < 1;
  }
}
function loadActiveUser(){
  activeUserId = ChartsAccounts.session();
  if(!activeUserId) return;
  syncUserUI();
  refreshCredits();
  if(window.ChartsAvatar) ChartsAvatar.refresh(activeUserId);
  if(window.ChartsNotif) ChartsNotif.refresh();
}
function syncUserUI(){
  document.querySelectorAll(".user-switch [data-user]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.user === activeUserId);
  });
  $("playerName").textContent = displayName(activeUserId);
}
function switchUser(nextId){

const plateSrc = new Map();
function plateUrl(job){
  const url = `../out/illustrations/webp/${job}.webp?v=10`;
  return plateSrc.get(url) || url;
}
function imgFallback(el){
  const first = el.getAttribute("src");
  el.onload = function(){
    const now = this.getAttribute("src");
    if(now !== first) plateSrc.set(first, now);
  };
  el.onerror = function(){
    this.onerror = function(){
      this.onerror = null;
      const m = this.src.replace("_x.webp", "_m.webp");
      if(m !== this.src) this.src = m;
    };
    const s = this.src;
    const n = s.indexOf("_B_") >= 0 ? s.replace("_B_", "_A_") : s.replace("_A_", "_B_");
    if(n !== s) this.src = n;
    else {
      this.onerror = null;
      const m = s.replace("_x.webp", "_m.webp");
      if(m !== s) this.src = m;
    }
  };
}

function ring(x, y, w, h, rx, color, sw, op){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op ?? 1}"/>`;
}
function frameSvg(kind, rank, color){
  if(kind === "none") return "";
  let o = "";
  if(kind === "simple"){
    o += ring(4, 4, CW - 8, CH - 8, 8, color, 1.5);
  } else if(kind === "double"){
    o += ring(4, 4, CW - 8, CH - 8, 8, color, 1.5);
    o += ring(8, 8, CW - 16, CH - 16, 6, color, 0.7, 0.55);
  } else {
    o += ring(4, 4, CW - 8, CH - 8, 8, color, 1.5);
    o += ring(8, 8, CW - 16, CH - 16, 6, color, 0.7, 0.55);
    if(rank >= 3) o += ring(12, 12, CW - 24, CH - 24, 5, color, 0.7, 0.4);
  }
  return `<svg class="frame" viewBox="0 0 ${CW} ${CH}" aria-hidden="true">${o}</svg>`;
}

function filteredList(){
  const data = loadOwned();
  const owned = data.got;
  const fresh = data.fresh || {};
  const fav = data.fav || {};
  let list = catalog.slice();
  if(filterRare) list = list.filter(c => c.rarete === filterRare);
  if(filterInstr) list = list.filter(c => c.instrument === filterInstr);
  if(filterGenre) list = list.filter(c => c.famille === filterGenre);
  if(filterQ) list = list.filter(c => matchesSearch(`${c.name} ${c.group || ""}`, filterQ));
  if(hideMissing || favOnly || newOnly) list = list.filter(c => owned[c.id]);
  if(newOnly) list = list.filter(c => fresh[c.id]);
  if(favOnly) list = list.filter(c => fav[c.id]);
  list.sort((a, b) => {
    const fa = fav[a.id] ? 1 : 0;
    const fb = fav[b.id] ? 1 : 0;
    if(fa !== fb) return fb - fa;
    if(sortBy === "name") return a.name.localeCompare(b.name, "fr");
    return (a.rank || 0) - (b.rank || 0);
  });
  return list;
}

function counts(){
  const owned = loadOwned().got;
  const ownedCards = catalog.filter(c => owned[c.id]);
  const byRare = Object.fromEntries(RARE_ORDER.map(r => [r, 0]));
  for(const c of ownedCards) byRare[c.rarete] = (byRare[c.rarete] || 0) + 1;
  return {
    owned: ownedCards.length,
    total: catalog.length,
    byRare
  };
}

function scaleBinderCards(){

function render(){
  buildFilterChips();
  $("pageMeta").textContent = pageMetaText();

  const list = filteredList();
  const data = loadOwned();
  const owned = data.got;
  const fav = data.fav || {};
  const size = pageSize();
  const pages = Math.max(1, Math.ceil(list.length / size));
  if(page > pages) page = pages;
  if(page < 1) page = 1;
  const slice = list.slice((page - 1) * size, page * size);

  $("status").hidden = true;
  $("binder").hidden = false;
  const grid = $("grid");
  if(!slice.length){
    lastGridHtml = "";
    grid.innerHTML = `<p class="empty">${
      favOnly
        ? "Aucun favori pour l’instant. Marque une carte avec ★."
        : newOnly
          ? "Aucune nouvelle carte."

            ? (viewingOther() ? "Aucune carte dans cette collection." : "Ouvre un booster pour commencer la collection.")
            : "Aucune carte pour ce filtre."
    }</p>`;
  } else {
    const html = slice.map(card => {
      const got = owned[card.id];
      return got
        ? ownedCardHtml(card, got.n || 1, isFresh(card.id), !!fav[card.id])
        : holeHtml(card);
    }).join("");
    if(html !== lastGridHtml){
      lastGridHtml = html;
      grid.innerHTML = html;
      grid.querySelectorAll(".art img").forEach(imgFallback);
      scaleBinderCards();

  $("pager").hidden = pages <= 1;
  $("pageLbl").textContent = `Page ${page} / ${pages}`;
  $("prev").disabled = page <= 1;
  $("next").disabled = page >= pages;
  syncSeeAllNewBtn();

let zoomCardId = null;
let zoomOriginIndex = 0;
let zoomClearedFresh = false;

function originCopies(got){
  if(typeof got === "number"){
    const n = Math.max(1, got | 0);
    return Array.from({ length: n }, () => ({ k: "booster" }));
  }
  const n = Math.max(1, (got && got.n) | 0);
  const list = Array.isArray(got && got.origins) ? got.origins.slice() : [];
  while(list.length < n) list.push({ k: "booster" });
  return list.slice(0, n);
}

const SALE_DAY_MS = 24 * 60 * 60 * 1000;
const SALE_DESTROY = { commune: 2, argent: 6, or: 20, platine: 60, diamant: 150 };
function minSellPrice(card){
  return SALE_DESTROY[card && card.rarete] || 2;
}
function priceFloorWhy(card){
  const min = minSellPrice(card);
  return `Prix minimum : ${min} crédit${min > 1 ? "s" : ""} (valeur de défausse).`;
}
function loadWalletRaw(){
  try {
    const data = JSON.parse(localStorage.getItem(walletKey()) || "");
    if(data && typeof data === "object"){
      if(!Array.isArray(data.acts)) data.acts = [];
      return data;
    }
  } catch {}
  return { v: 1, credits: 0, acts: [] };
}
function saveWalletRaw(data){
  localStorage.setItem(walletKey(), JSON.stringify(data));
}
function competitionUses(cardId){
  return window.ChartsHistory ? ChartsHistory.activeUses(activeUserId, cardId) : 0;
}
function lineupUses(cardId){
  let inLineup = 0;
  try {
    const data = JSON.parse(localStorage.getItem(`charts.s1.${activeUserId}.lineup`) || "");
    const slots = data && data.slots || {};
    inLineup = Object.values(slots).filter(id => id === cardId).length;
  } catch {}
  return Math.max(inLineup, competitionUses(cardId));
}
function lineupWhy(cardId){
  return competitionUses(cardId) > 0
    ? "Carte en compétition Arena cette semaine — vente et échange impossibles avant lundi."
    : "Carte dans le line-up Arena — retire-la du groupe pour la vendre.";
}
function myListings(cardId){
  return (loadMarket().listings || []).filter(l => l.seller === activeUserId && l.cardId === cardId);
}
function freeCopies(cardId){
  const got = loadOwned().got[cardId];
  const n = got ? (got.n || 0) : 0;
  return Math.max(0, n - myListings(cardId).length - lineupUses(cardId));
}
function tradableCopies(cardId){
  return freeCopies(cardId);
}
function suggestSalePrice(card){
  const d = minSellPrice(card);
  return Math.max(d, d * 4);
}
function salePayoutText(price, card){
  const p = Math.floor(Number(price) || 0);
  if(p < minSellPrice(card)) return priceFloorWhy(card);
  const tax = Math.round(p * 0.10);
  const pay = Math.max(0, p - tax);
  return tax ? `Tu recevras ${pay} cr (taxe ${tax} cr).` : `Tu recevras ${pay} cr.`;
}
let snackTimer = 0;
function pinSnackbar(el){
  const gap = 24;
  const viewBottom = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  el.style.bottom = gap + "px";
  for(let i = 0; i < 3; i++){
    const delta = el.getBoundingClientRect().bottom - (viewBottom - gap);
    if(Math.abs(delta) <= 2) break;
    const current = parseFloat(getComputedStyle(el).bottom) || gap;
    el.style.bottom = Math.max(gap, current + delta) + "px";
  }
}
function showSnackbar(message){
  const el = $("snackbar");
  if(!el) return;
  el.textContent = message;
  el.classList.add("show");
  pinSnackbar(el);
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => el.classList.remove("show"), 2800);
}
window.addEventListener("resize", () => {
  const el = $("snackbar");
  if(el && el.classList.contains("show")) pinSnackbar(el);
});
function noteSale(){
  const w = loadWalletRaw();
  const since = Date.now() - SALE_DAY_MS;
  w.acts = (w.acts || []).filter(a => a.t >= since);
  w.acts.push({ k: "list", t: Date.now() });
  saveWalletRaw(w);
}
async function listCardForSale(cardId, price){
  if(window.ChartsState){
    const p = Math.floor(Number(price) || 0);
    const listed = catalog.find(c => c.id === cardId);
    if(p < minSellPrice(listed)) return { ok: false, why: priceFloorWhy(listed) };
    try { await ChartsState.marketAct("create_listing", { p_card_id: cardId, p_price: p }); }
    catch(err){ return { ok: false, why: err.message }; }
    return { ok: true };
  }
  const card = catalog.find(c => c.id === cardId);
  const p = Math.floor(Number(price) || 0);
  if(!card) return { ok: false, why: "Carte inconnue." };
  if(isFavorite(cardId)) return { ok: false, why: "Cette carte est en favori — retire-la des favoris pour la vendre." };
  if(p < minSellPrice(card)) return { ok: false, why: priceFloorWhy(card) };
  if(tradableCopies(cardId) < 1){
    if(lineupUses(cardId) > 0) return { ok: false, why: lineupWhy(cardId) };
    return { ok: false, why: myListings(cardId).length
      ? "Tous tes exemplaires sont déjà en vente."
      : "Tu n’as pas cette carte." };
  }
  const m = loadMarket();
  if(!Array.isArray(m.listings)) m.listings = [];
  m.listings.unshift({
    id: `${activeUserId}-${cardId}-${Date.now()}`,
    cardId,
    price: p,
    seller: activeUserId,
    t: Date.now()
  });
  saveMarket(m);
  noteSale();
  return { ok: true };
}
async function cancelMyListing(listingId){
  if(window.ChartsState){
    try { await ChartsState.marketAct("cancel_listing", { p_listing_id: Number(listingId) }); }
    catch(err){ alert(err.message); }
    return;
  }
  const m = loadMarket();
  const i = (m.listings || []).findIndex(l => l.id === listingId && l.seller === activeUserId);
  if(i < 0) return;
  m.listings.splice(i, 1);
  for(const o of m.offers || []){
    if(o.listingId === listingId && o.status === "pending") o.status = "cancelled";
  }
  for(const t of m.trades || []){
    if(t.listingId === listingId && t.status === "pending") t.status = "cancelled";
  }
  saveMarket(m);
}
function paintSellForm(){
  const el = $("zoomActions");
  const card = catalog.find(c => c.id === zoomCardId);
  if(!el || !card) return;
  const price = suggestSalePrice(card);
  const floor = minSellPrice(card);
  el.innerHTML =
    `<label>Prix de vente<input type="number" id="sellPrice" min="${floor}" step="1" value="${price}"></label>` +
    `<p class="hint" id="sellHint">${esc(salePayoutText(price, card))}</p>` +
    `<button type="button" data-act="sell-ok">Confirmer</button>` +
    `<button type="button" data-act="sell-cancel">Annuler</button>`;
  const input = $("sellPrice");
  if(input){
    input.focus();
    input.select();
  }
}
function paintZoomActions(){
  const el = $("zoomActions");
  if(!el || !zoomCardId) return;
  if(viewingOther()){
    el.innerHTML = "";
    return;
  }
  if(isFavorite(zoomCardId)){
    el.innerHTML = `<p class="hint">Favori — vente indisponible.</p>`;
    return;
  }
  const listed = myListings(zoomCardId);
  const bits = [];
  const marketOpen = !window.ChartsState || ChartsState.marketOpen;
  if(marketOpen && tradableCopies(zoomCardId) >= 1){
    bits.push(`<button type="button" data-act="sell">Vendre</button>`);
  } else if(freeCopies(zoomCardId) < 1 && lineupUses(zoomCardId) > 0){
    bits.push(`<p class="hint">${competitionUses(zoomCardId) > 0
      ? "En compétition Arena — vente et échange indisponibles avant lundi."
      : "Line-up Arena — vente indisponible."}</p>`);
  }
  if(listed.length){
    bits.push(`<p class="hint">En vente · ${listed[0].price} cr${listed.length > 1 ? ` · ${listed.length} annonces` : ""}</p>`);
    bits.push(`<button type="button" data-act="unsell" data-lid="${esc(listed[0].id)}">Retirer l’annonce</button>`);
  }
  el.innerHTML = bits.join("");
}
async function handleZoomSale(act, lid){
  if(act === "sell"){
    paintSellForm();
    return;
  }
  if(act === "sell-cancel" || act === "unsell"){
    if(act === "unsell" && lid){
      await cancelMyListing(lid);
      showSnackbar("Annonce retirée");
    }
    paintZoomActions();
    return;
  }
  if(act === "sell-ok"){
    const price = Math.floor(Number(($("sellPrice") || {}).value) || 0);
    const hint = $("sellHint");
    const card = catalog.find(c => c.id === zoomCardId);
    const res = await listCardForSale(zoomCardId, price);
    if(!res.ok){
      if(hint) hint.textContent = res.why;
      return;
    }
    paintZoomActions();
    showSnackbar(`Annonce publiée · ${card ? card.name : "Carte"} à ${price} crédit${price === 1 ? "" : "s"}`);
  }
}
function originText(o){
  if(!o || o.k === "booster") return "Ouvert dans un booster";
  if(o.k === "buy"){
    if(o.cr == null || o.cr === "") return "Acheté sur le marché";
    const cr = Math.max(0, Math.round(Number(o.cr) || 0));
    return `Acheté pour ${cr} CR`;
  }
  if(o.k === "trade"){
    return o.for ? `Échangé contre ${String(o.for)}` : "Reçu par échange";
  }
  if(o.k === "reward") return "Récompense Arena";
  return "Ouvert dans un booster";
}

function paintZoomOrigin(){
  const el = $("zoomCard").querySelector(".zoom-origin");
  if(!el || !zoomCardId) return;
  const list = originCopies(loadOwned().got[zoomCardId]);
  if(zoomOriginIndex < 0) zoomOriginIndex = 0;
  if(zoomOriginIndex >= list.length) zoomOriginIndex = list.length - 1;
  const multi = list.length > 1;
  const label = originText(list[zoomOriginIndex]);
  const count = multi ? ` (${zoomOriginIndex + 1}/${list.length})` : "";
  const nav = (step, name, glyph) =>
    `<button type="button" class="zoom-origin-nav" data-origin-step="${step}" aria-label="${name}"${
      (step < 0 && zoomOriginIndex <= 0) || (step > 0 && zoomOriginIndex >= list.length - 1) ? " disabled" : ""
    }>${glyph}</button>`;
  el.innerHTML =
    (multi ? nav(-1, "Exemplaire précédent", "‹") : "")
    + `<span class="zoom-origin-text">${esc(label + count)}</span>`
    + (multi ? nav(1, "Exemplaire suivant", "›") : "");
}

function stepZoomOrigin(step){
  zoomOriginIndex += step;
  paintZoomOrigin();
}

function openZoom(cardId){

});
$("genreChips").addEventListener("click", ev => {
  const btn = ev.target.closest("[data-genre]");
  if(!btn) return;
  filterGenre = btn.dataset.genre || "";
  page = 1;
  render();
});
$("sortBy").addEventListener("change", () => {
  sortBy = $("sortBy").value === "name" ? "name" : "num";
  page = 1;
  render();
});
let qTimer = 0;
$("q").addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    filterQ = $("q").value || "";
    page = 1;
    render();
  }, 120);
});
function setHideMissing(on){
  hideMissing = on;
  $("hideMissing").classList.toggle("on", !on);
  $("hideMissing").setAttribute("aria-pressed", on ? "false" : "true");
}
$("hideMissing").addEventListener("click", () => {
  setHideMissing(!hideMissing);
  if(!hideMissing){
    for(const id of ["newOnly", "favOnly"]){
      $(id).classList.remove("on");
      $(id).setAttribute("aria-pressed", "false");
    }
    newOnly = false;
    favOnly = false;
    syncSeeAllNewBtn();
  }
  page = 1;
  render();
});
$("newOnly").addEventListener("click", () => {
  newOnly = !newOnly;
  $("newOnly").classList.toggle("on", newOnly);
  $("newOnly").setAttribute("aria-pressed", newOnly ? "true" : "false");
  if(newOnly) setHideMissing(true);
  page = 1;
  render();
});
$("seeAllNew").addEventListener("click", ev => {
  ev.preventDefault();
  ev.stopPropagation();
  clearAllFresh();
  newOnly = false;
  $("newOnly").classList.remove("on");
  $("newOnly").setAttribute("aria-pressed", "false");
  syncSeeAllNewBtn();
  page = 1;
  render();
});
$("favOnly").addEventListener("click", () => {
  favOnly = !favOnly;
  $("favOnly").classList.toggle("on", favOnly);
  $("favOnly").setAttribute("aria-pressed", favOnly ? "true" : "false");
  if(favOnly) setHideMissing(true);
  page = 1;
  render();
});
$("prev").addEventListener("click", () => { page--; render(); });
$("next").addEventListener("click", () => { page++; render(); });
let lastMobileGrid = window.matchMedia("(max-width: 820px)").matches;
window.addEventListener("resize", () => {
  scaleBinderCards();
  const now = window.matchMedia("(max-width: 820px)").matches;
  if(now !== lastMobileGrid){
    lastMobileGrid = now;
    page = 1;
    if(catalog.length) render();
  }
});
$("grid").addEventListener("click", ev => {
  const favBtn = ev.target.closest("[data-fav-toggle]");
  if(favBtn){
    ev.preventDefault();
    ev.stopPropagation();
    const id = favBtn.dataset.favToggle;
    const on = toggleFavorite(id);
    if(favOnly && !on){
      render();
      return;
    }
    favBtn.classList.toggle("on", on);
    favBtn.setAttribute("aria-pressed", on ? "true" : "false");
    favBtn.setAttribute("aria-label", on ? "Retirer des favoris" : "Ajouter aux favoris");
    favBtn.title = on ? "Retirer des favoris" : "Ajouter aux favoris";
    $("pageMeta").textContent = pageMetaText();
    return;
  }
  if(ev.target.closest(".cell.hole")) return;
  const cell = ev.target.closest(".cell:not(.hole)");
  if(!cell) return;
  openZoom(cell.dataset.id);
});
$("grid").addEventListener("keydown", ev => {
  if(ev.key !== "Enter" && ev.key !== " ") return;
  const card = ev.target.closest(".card.zoomable");
  if(!card) return;
  ev.preventDefault();
  openZoom(card.dataset.id);
});
$("zoom").addEventListener("click", ev => {
  const stepBtn = ev.target.closest("[data-origin-step]");
  if(stepBtn && !stepBtn.disabled){
    stepZoomOrigin(Number(stepBtn.dataset.originStep) || 0);
    return;
  }
  if(stepBtn) return;
  const tip = ev.target.closest(".info-tip");
  if(tip){
    tip.classList.toggle("open");
    return;
  }
  if(ev.target.closest(".zoom-actions")){
    const input = ev.target.closest("#sellPrice");
    if(!input && ev.target.id !== "sellPrice"){
      const act = ev.target.closest("[data-act]");
      if(act) handleZoomSale(act.dataset.act, act.dataset.lid || "");
    }
    return;
  }
  closeZoom();
});
$("zoom").addEventListener("input", ev => {
  if(ev.target.id !== "sellPrice") return;
  const hint = $("sellHint");
  const card = catalog.find(c => c.id === zoomCardId);
  if(hint) hint.textContent = salePayoutText(ev.target.value, card);
});

const menuBtn = $("menuBtn");
const drawer = $("drawer");
const veil = $("drawerVeil");
function setMenuOpen(open){
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  drawer.hidden = !open;
  veil.hidden = !open;
  if(open) refreshCredits();
}
menuBtn.addEventListener("click", () => setMenuOpen(menuBtn.getAttribute("aria-expanded") !== "true"));
$("drawerClose").addEventListener("click", () => setMenuOpen(false));
veil.addEventListener("click", () => setMenuOpen(false));
document.addEventListener("keydown", ev => {
  if(!$("zoom").hidden && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")){
    ev.preventDefault();
    stepZoomOrigin(ev.key === "ArrowLeft" ? -1 : 1);
    return;
  }
  if(ev.key === "Escape"){
    setMenuOpen(false);
    closeZoom();
  }
});
async function boot(){
  if(profileUserId){
    document.title = `Charts — ${displayName(profileUserId)}`;
    $("pageHead").classList.add("profile");
    $("profileBanner").hidden = false;
    $("pageTitle").textContent = displayName(profileUserId);
    hideMissing = true;
    ["hideMissing", "newOnly", "favOnly", "seeAllNew"].forEach(id => {
      const el = $(id);
      if(el) el.hidden = true;
    });
    const face = $("profileFace");
    const url = window.ChartsAvatar && ChartsAvatar.get(profileUserId);
    if(face && url){
      face.style.backgroundImage = `url("${url.replace(/"/g, "")}")`;
      face.classList.remove("empty");
    }
  }
  if(window.ChartsAvatar){
    ChartsAvatar.bind({ getUserId: () => activeUserId });
  }
  if(window.ChartsNotif){
    ChartsNotif.bind({ getUserId: () => activeUserId });
  }
  loadActiveUser();
  try {
    const state = !window.ChartsState ? null
      : viewingOther() ? ChartsState.loadPlayer(profileUserId)
      : ChartsState.ready();
    const [doc] = await Promise.all([ChartsApi.catalog(), state]);
    catalog = cardsFromCatalog(doc);
    catalog.sort((a, b) => (a.rank || 0) - (b.rank || 0));
    render();
  } catch (err) {
    $("status").textContent = err && err.message && window.ChartsState
      ? err.message
      : "Impossible de charger le catalogue.";
  }
}
boot();
document.addEventListener("charts:credits-changed", () => refreshCredits());
document.addEventListener("charts:state", () => {
  if(catalog.length && !viewingOther() && $("zoom").hidden) render();
});
document.addEventListener("charts:market", () => {
  if(catalog.length && !viewingOther() && $("zoom").hidden) render();
});
</script>
<script src="js/mobile-ui.js?v=11"></script>
</body>
