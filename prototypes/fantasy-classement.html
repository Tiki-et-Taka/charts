<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Classement Arena</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=17">
<script src="js/site-scale.js?v=9"></script>
<script src="js/legal-return.js?v=2"></script>
<style>
  :root {
    --bg: #0d0d0d;
    --bg-elev: #141414;
    --ink: #f2f0eb;
    --muted: #8a8680;
    --line: #2a2a2a;
    --line-hi: #3a3a3a;
    --accent: #e68a1e;
    --accent-ink: #111;
    --panel: #161616;
    --font-display: "Archivo Black", "Oswald", Impact, sans-serif;
    --font-ui: "Oswald", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
  }
  a { color: inherit; }
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    opacity: .14;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .top {
    position: sticky; top: 0; z-index: 20;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: rgba(13,13,13,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    justify-self: start;
    font-family: var(--font-display);
    font-size: clamp(22px, 3vw, 30px);
    letter-spacing: .04em;
    text-transform: uppercase;
    text-decoration: none;
    line-height: 1;
  }
  .nav-main {
    justify-self: center;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 20px;
  }
  .nav-main a {
    position: relative;
    text-decoration: none;
    font-size: 12px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); padding: 6px 0 8px;
  }
  .nav-main a:hover { color: var(--ink); }
  .nav-main a.on { color: var(--ink); }
  .nav-main a.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--accent);
  }
  .top-actions {
    justify-self: end; display: flex; align-items: center; gap: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--panel);
    padding: 6px 10px; font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
    white-space: nowrap;
  }
  .chip .coin {
    width: 22px; height: 14px; border-radius: 0;
    display: block; object-fit: contain;
    box-shadow: none;
    flex: 0 0 auto;
  }
  .chip.btn {
    appearance: none; font: inherit; cursor: pointer; color: inherit;
  }
  .chip.btn:hover { border-color: var(--line-hi); background: #1c1c1c; }
  .chip .ico,
  .chip.btn .ico { width: 14px; height: 14px; opacity: .75; }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .back {
    display: inline-block;
    margin-bottom: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
  }
  .back:hover { color: var(--ink); }
  .page-head {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .page-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 42px);
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: .95;
  }
  .page-sub {
    margin: 12px 0 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--ink);
  }

  .ranking {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .ranking th,
  .ranking td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .ranking th {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ranking td {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .ranking .num {
    width: 90px;
    font-family: var(--font-display);
    font-size: 18px;
  }
  .ranking .num sup { font-size: .55em; }
  .ranking .pts {
    text-align: right;
    font-family: var(--font-mono);
    font-weight: 500;
    white-space: nowrap;
  }
  .ranking th.pts { text-align: right; }
  .ranking tr.me td { background: rgba(230,138,30,.08); }
  .ranking tr.me .num { color: var(--accent); }
  .player-link {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .player-link:hover { color: var(--accent); }
  .me-tag {
    margin-left: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .empty {
    border: 1px dashed var(--line);
    padding: 36px 16px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .drawer-veil {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 92vw);
    background: var(--bg-elev); border-left: 1px solid var(--line);
    z-index: 45; padding: 18px; overflow: auto;
  }
  .drawer .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .drawer h2 {
    margin: 0; font-family: var(--font-display); font-size: 20px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .drawer .close {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font-size: 28px; line-height: 1; cursor: pointer;
  }

  @media (max-width: 720px) {
    .top { grid-template-columns: 1fr auto; }
    .nav-main { grid-column: 1 / -1; justify-content: flex-start; }
    .ranking th, .ranking td { padding: 10px; }
    .ranking .num { width: 60px; }
  }
</style>
<link rel="stylesheet" href="css/mobile.css?v=3">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="lobby.html"><img class="brand-logo" src="img/favicon.png?v=2" alt="" width="32" height="32">Charts</a>
  <nav class="nav-main" aria-label="Principal">
    <a href="lobby.html">Lobby</a>
    <a href="booster.html?v=2">Booster</a>
    <a href="classeur.html?v=2">Classeur</a>
    <a href="booster.html?v=2#marche">Marché</a>
    <a class="on" href="fantasy.html?v=20" aria-current="page">Arena</a>
  </nav>
  <div class="top-actions">
    <div id="notifMount"></div>
    <span class="chip" aria-label="Crédits">
      <img class="coin" src="img/credit-ticket.png?v=1" alt="" width="22" height="14" aria-hidden="true">
      <span><b id="creditsBal">0</b> CR</span>
    </span>
    <button type="button" class="chip btn no-avatar" id="menuBtn" aria-label="Profil" aria-expanded="false" aria-controls="drawer" aria-haspopup="dialog">
      <span class="avatar-face sm empty" data-avatar-face aria-hidden="true"></span>
      <svg class="ico" data-avatar-fallback viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      <span id="playerName">Joueur A</span>
    </button>
  </div>
</header>

<main class="wrap">
  <a class="back" href="fantasy.html#terminees">← Retour aux compétitions</a>
  <header class="page-head">
    <h1 class="page-title">Classement</h1>
    <p class="page-sub" id="rankingSub"></p>
  </header>

  <div id="rankingBody"></div>

  <footer class="site-foot">
    <nav class="legal-links" aria-label="Informations légales">
      <a href="legal/regles.html">Règles</a>
      <a href="legal/index.html?v=2">Mentions légales</a>
    </nav>
  </footer>
</main>

<div class="drawer-veil" id="drawerVeil" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="head">
    <h2 id="drawerTitle">Profil</h2>
    <button type="button" class="close" id="drawerClose" aria-label="Fermer">×</button>
  </div>
  <div class="avatar-block">
    <label class="avatar-pick" title="Changer la photo">
      <span class="avatar-face empty" data-avatar-face aria-hidden="true"></span>
      <input type="file" id="avatarFile" accept="image/*" hidden>
    </label>
    <p class="avatar-status" id="avatarStatus"></p>
  </div>
  <button type="button" class="logout" id="logoutBtn">Déconnexion</button>
</aside>

<script src="js/profile-avatar.js"></script>
<script src="js/notifications.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="js/charts-config.js?v=1"></script>
<script src="js/charts-api.js?v=2"></script>
<script src="js/accounts.js?v=6"></script>
<script src="js/charts-state.js?v=5"></script>
<script src="js/credits-shop.js?v=7"></script>
<script src="js/weekly-listens.js?v=7"></script>
<script src="js/fantasy-lock.js?v=3"></script>
<script src="js/fantasy-history.js?v=5"></script>
<script>
if(window.ChartsAuthBlocked) throw new Error("auth");
const COMP_TITLES = { "all-stars-5": "All Stars — 5" };
const FAMILY_FROM_CATALOG = { hiphop: "hip-hop", electro: "électro", rnb: "R&B" };

let activeUserId = "";
const $ = id => document.getElementById(id);

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function playerLink(id, pseudo){
  const name = pseudo || ChartsAccounts.name(id);
  if(!id) return esc(name);
  return `<a class="player-link" href="classeur.html?v=2&joueur=${esc(id)}">${esc(name)}</a>`;
}
function rankHtml(rank){
  return rank === 1 ? `1<sup>er</sup>` : `${rank.toLocaleString("fr-FR")}<sup>e</sup>`;
}
function shortDay(date){
  return date.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
}
function cardsById(doc){
  const artists = Object.fromEntries((doc.artists || []).map(a => [a.qid, a]));
  const plates = Object.fromEntries((doc.plates || []).map(p => [p.id, p]));
  const out = new Map();
  for(const row of doc.cards || []){
    const artist = artists[row.artist_qid];
    const plate = plates[row.plate_id];
    if(!artist || !plate) continue;
    const instrument = artist.instrument || plate.instrument;
    out.set(row.id, {
      id: row.id,
      qid: artist.qid,
      famille: FAMILY_FROM_CATALOG[row.family] || row.family,
      instrument,
      instruments: artist.instruments || [instrument]
    });
  }
  return out;
}

function refreshCredits(){
  let credits = 0;
  try {
    const data = JSON.parse(localStorage.getItem(`charts.s1.${activeUserId}.wallet`) || "");
    if(data && typeof data.credits === "number") credits = data.credits;
  } catch {}
  $("creditsBal").textContent = Number(credits).toLocaleString("fr-FR");
}
function loadActiveUser(){
  activeUserId = ChartsAccounts.session();
  if(!activeUserId) return;
  $("playerName").textContent = ChartsAccounts.name(activeUserId);
  refreshCredits();
  if(window.ChartsAvatar) ChartsAvatar.refresh(activeUserId);
  if(window.ChartsNotif) ChartsNotif.refresh();
}

const menuBtn = $("menuBtn");
const drawer = $("drawer");
const veil = $("drawerVeil");
function setMenuOpen(open){
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  drawer.hidden = !open;
  veil.hidden = !open;
  if(open) refreshCredits();
}
menuBtn.addEventListener("click", () => setMenuOpen(menuBtn.getAttribute("aria-expanded") !== "true"));
$("drawerClose").addEventListener("click", () => setMenuOpen(false));
veil.addEventListener("click", () => setMenuOpen(false));
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape") setMenuOpen(false);
});

async function render(){
  const params = new URLSearchParams(location.search);
  const compId = params.get("comp") || "";
  const weekStart = params.get("semaine") || "";
  const body = $("rankingBody");
  const title = COMP_TITLES[compId];
  if(!title || !/^\d{4}-\d{2}-\d{2}$/.test(weekStart)){
    $("rankingSub").textContent = "";
    body.innerHTML = `<p class="empty">Compétition introuvable.</p>`;
    return;
  }
  document.title = `Charts — Classement ${title}`;
  const sub = `${title} · Semaine ${ChartsHistory.weekLabel(weekStart)}`;
  $("rankingSub").textContent = sub;
  if(window.ChartsState){
    await ChartsState.ready().catch(() => null);
    let rows = [];
    try { rows = await ChartsState.standings(compId, weekStart); }
    catch { rows = []; }
    if(!rows.length){
      body.innerHTML = `<p class="empty">Résultat le ${esc(shortDay(ChartsHistory.resultDate(weekStart)))}.</p>`;
      return;
    }
    if(window.ChartsAccounts) await ChartsAccounts.refreshProfiles().catch(() => null);
    $("rankingSub").textContent = `${sub} · ${rows.length.toLocaleString("fr-FR")} participant${rows.length > 1 ? "s" : ""}`;
    body.innerHTML = rankingTable(rows);
    return;
  }
  const [week, catalog] = await Promise.all([
    ChartsListens.loadWeek(weekStart),
    ChartsApi.catalog().catch(() => null)
  ]);
  if(!week || !catalog){
    body.innerHTML = `<p class="empty">Résultat le ${esc(shortDay(ChartsHistory.resultDate(weekStart)))}.</p>`;
    return;
  }
  const rows = ChartsHistory.standings(week, compId, weekStart, cardsById(catalog));
  if(!rows.length){
    body.innerHTML = `<p class="empty">Aucun participant.</p>`;
    return;
  }
  $("rankingSub").textContent = `${sub} · ${rows.length.toLocaleString("fr-FR")} participant${rows.length > 1 ? "s" : ""}`;
  body.innerHTML = rankingTable(rows);
}
function rankingTable(rows){
  return `<table class="ranking">
    <thead><tr><th scope="col">Rang</th><th scope="col">Joueur</th><th scope="col" class="pts">Points</th></tr></thead>
    <tbody>${rows.map(row => {
      const me = row.userId === activeUserId;
      return `<tr${me ? ` class="me"` : ""}>
        <td class="num">${rankHtml(Number(row.rank))}</td>
        <td>${playerLink(row.userId, row.pseudo)}${me ? `<span class="me-tag">Toi</span>` : ""}</td>
        <td class="pts">${ChartsListens.formatScore(row.total)} pts</td>
      </tr>`;
    }).join("")}</tbody>
  </table>`;
}

if(window.ChartsAvatar) ChartsAvatar.bind({ getUserId: () => activeUserId });
if(window.ChartsNotif) ChartsNotif.bind({ getUserId: () => activeUserId });
loadActiveUser();
render();
</script>
<script src="js/mobile-ui.js?v=3"></script>
</body>
</html>
